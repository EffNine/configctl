[workspace]
resolver = "2"
members = [
    "crates/configctl-core",
    "crates/configctl-discovery",
    "crates/configctl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
dirs = "6.0"
tempfile = "3.27"

[profile.release]
lto = "thin"
