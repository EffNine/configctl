[workspace]
resolver = "2"
members = [
    "crates/configctl-core",
    "crates/configctl-discovery",
    "crates/configctl-cli",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"
dirs = "6.0"
tempfile = "3.27"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
rpassword = "7.0"

[profile.release]
lto = "thin"
